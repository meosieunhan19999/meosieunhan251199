<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tùng Lâm</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md">
                <i data-lucide="bot" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-base md:text-lg leading-none">AI Tùng Lâm</h1>
                <span class="text-xs text-slate-500 dark:text-slate-400">3 Cấp Độ: Prompt • RAG • Đa Động Cơ</span>
            </div>
        </div>
        
        <div class="flex items-center space-x-2">
            <button id="toggleKnowledgeBtn" class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-1.5 transition">
                <i data-lucide="book-open" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Tri thức (RAG)</span>
                <span id="knowledgeCountBadge" class="bg-blue-600 text-white rounded-full px-1.5 py-0.2 text-[10px] hidden">0</span>
            </button>
            <button id="toggleConfigBtn" class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-1.5 transition">
                <i data-lucide="settings" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Cấu hình</span>
            </button>
            <button id="themeToggleBtn" class="p-2 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300">
                <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
                <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Panel Cấu hình -->
        <aside id="configPanel" class="absolute inset-y-0 right-0 w-80 max-w-full bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 shadow-xl p-4 flex flex-col space-y-4 transform translate-x-full transition-transform duration-300 z-20 overflow-y-auto">
            <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-800">
                <h2 class="font-semibold text-sm flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-blue-500"></i> Cấu hình Mô hình
                </h2>
                <button id="closeConfigBtn" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div>
                <label class="block text-xs font-medium mb-1">Động cơ xử lý (Engine):</label>
                <select id="engineSelect" class="w-full text-xs p-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none">
                    <option value="gemini">Google Gemini API (Khuyên dùng)</option>
                    <option value="builtin">Động cơ Nội trang</option>
                    <option value="ollama">Ollama Local (http://localhost:11434)</option>
                </select>
            </div>

            <div id="apiKeyContainer">
                <label class="block text-xs font-medium mb-1">Gemini API Key:</label>
                <input type="password" id="geminiApiKey" placeholder="AIzaSy..." class="w-full text-xs p-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none">
                <p class="text-[10px] text-slate-500 mt-1">Lấy key tại aistudio.google.com</p>
            </div>

            <div id="ollamaContainer" class="hidden">
                <label class="block text-xs font-medium mb-1">Tên Model Ollama:</label>
                <input type="text" id="ollamaModelName" value="llama3" class="w-full text-xs p-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none">
            </div>

            <div class="flex-1 flex flex-col">
                <label class="block text-xs font-medium mb-1">System Prompt (Vai trò & Tính cách):</label>
                <textarea id="systemPrompt" rows="7" class="w-full flex-1 text-xs p-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none resize-none">Bạn là AI Tùng Lâm - một trợ lý ảo thông minh, nhiệt tình, lịch sự và đáng tin cậy. Nếu có tài liệu ngữ cảnh đính kèm, hãy ưu tiên trả lời dựa trên tài liệu đó. Nếu không có thông tin, hãy thành thật trả lời là không biết.</textarea>
            </div>

            <button id="saveConfigBtn" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium rounded-lg transition">
                Lưu cấu hình
            </button>
        </aside>

        <!-- Panel Tri thức (RAG) -->
        <aside id="knowledgePanel" class="absolute inset-y-0 right-0 w-80 max-w-full bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 shadow-xl p-4 flex flex-col space-y-4 transform translate-x-full transition-transform duration-300 z-20 overflow-y-auto">
            <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-800">
                <h2 class="font-semibold text-sm flex items-center gap-2">
                    <i data-lucide="database" class="w-4 h-4 text-indigo-500"></i> Kho tri thức riêng (RAG)
                </h2>
                <button id="closeKnowledgeBtn" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div>
                <label class="block text-xs font-medium mb-1">Tải file tài liệu (.txt, .md):</label>
                <input type="file" id="fileInput" accept=".txt,.md" class="w-full text-xs file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-xs file:bg-blue-50 file:text-blue-700 dark:file:bg-slate-800 dark:file:text-slate-200">
            </div>

            <div class="flex-1 flex flex-col">
                <label class="block text-xs font-medium mb-1">Hoặc dán nội dung văn bản:</label>
                <textarea id="knowledgeText" rows="5" placeholder="Dán văn bản hoặc tài liệu vào đây..." class="w-full text-xs p-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none resize-none"></textarea>
                <button id="addKnowledgeBtn" class="mt-2 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-lg transition">
                    + Thêm vào kho tri thức
                </button>
            </div>

            <div class="flex-1 border-t border-slate-200 dark:border-slate-800 pt-2 flex flex-col">
                <span class="text-xs font-medium text-slate-500 mb-2">Đoạn tri thức đã nạp:</span>
                <div id="knowledgeList" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
                    <p class="text-slate-400 italic text-center py-4">Chưa có dữ liệu nào.</p>
                </div>
            </div>
        </aside>

        <!-- Khung chat chính -->
        <main class="flex-1 flex flex-col h-full max-w-4xl mx-auto w-full px-2 sm:px-4">
            <div id="chatMessages" class="flex-1 overflow-y-auto py-4 space-y-4">
                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center shrink-0">
                        <i data-lucide="bot" class="w-4 h-4"></i>
                    </div>
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3.5 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] text-sm leading-relaxed">
                        Xin chào! Tôi là <b>AI Tùng Lâm</b>. Hãy vào mục <b>Cấu hình</b> để dán API key hoặc vào <b>Tri thức (RAG)</b> để tải tài liệu lên nhé!
                    </div>
                </div>
            </div>

            <!-- Khung nhập tin nhắn -->
            <div class="p-3 bg-white/60 dark:bg-slate-900/60 backdrop-blur rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm mb-3 shrink-0">
                <form id="chatForm" class="flex items-end gap-2">
                    <textarea id="userInput" rows="1" placeholder="Nhập câu hỏi của bạn tại đây..." class="flex-1 bg-transparent border-0 focus:ring-0 outline-none text-sm resize-none max-h-32 py-1.5 px-2"></textarea>
                    <button type="submit" id="sendBtn" class="p-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md transition disabled:opacity-50">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Logic Script -->
    <script>
        if (window.lucide) {
            lucide.createIcons();
        }

        let knowledgeBase = JSON.parse(localStorage.getItem('ai_knowledge') || '[]');
        let config = JSON.parse(localStorage.getItem('ai_config') || JSON.stringify({
            engine: 'gemini',
            apiKey: '',
            ollamaModel: 'llama3',
            systemPrompt: 'Bạn là AI Tùng Lâm - một trợ lý ảo thông minh, nhiệt tình, lịch sự và đáng tin cậy. Nếu có tài liệu ngữ cảnh đính kèm, hãy ưu tiên trả lời dựa trên tài liệu đó. Nếu không có thông tin, hãy thành thật trả lời là không biết.'
        }));

        const configPanel = document.getElementById('configPanel');
        const knowledgePanel = document.getElementById('knowledgePanel');
        const toggleConfigBtn = document.getElementById('toggleConfigBtn');
        const closeConfigBtn = document.getElementById('closeConfigBtn');
        const toggleKnowledgeBtn = document.getElementById('toggleKnowledgeBtn');
        const closeKnowledgeBtn = document.getElementById('closeKnowledgeBtn');
        const engineSelect = document.getElementById('engineSelect');
        const apiKeyContainer = document.getElementById('apiKeyContainer');
        const ollamaContainer = document.getElementById('ollamaContainer');
        const geminiApiKey = document.getElementById('geminiApiKey');
        const ollamaModelName = document.getElementById('ollamaModelName');
        const systemPrompt = document.getElementById('systemPrompt');
        const saveConfigBtn = document.getElementById('saveConfigBtn');
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const knowledgeText = document.getElementById('knowledgeText');
        const addKnowledgeBtn = document.getElementById('addKnowledgeBtn');
        const fileInput = document.getElementById('fileInput');
        const knowledgeList = document.getElementById('knowledgeList');
        const knowledgeCountBadge = document.getElementById('knowledgeCountBadge');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        engineSelect.value = config.engine || 'gemini';
        geminiApiKey.value = config.apiKey || '';
        ollamaModelName.value = config.ollamaModel || 'llama3';
        systemPrompt.value = config.systemPrompt;
        updateEngineUI();
        renderKnowledgeList();

        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        toggleConfigBtn.onclick = () => { configPanel.classList.toggle('translate-x-full'); knowledgePanel.classList.add('translate-x-full'); };
        closeConfigBtn.onclick = () => configPanel.classList.add('translate-x-full');
        toggleKnowledgeBtn.onclick = () => { knowledgePanel.classList.toggle('translate-x-full'); configPanel.classList.add('translate-x-full'); };
        closeKnowledgeBtn.onclick = () => knowledgePanel.classList.add('translate-x-full');

        engineSelect.onchange = updateEngineUI;
        function updateEngineUI() {
            apiKeyContainer.classList.toggle('hidden', engineSelect.value !== 'gemini');
            ollamaContainer.classList.toggle('hidden', engineSelect.value !== 'ollama');
        }

        saveConfigBtn.onclick = () => {
            config.engine = engineSelect.value;
            config.apiKey = geminiApiKey.value.trim();
            config.ollamaModel = ollamaModelName.value.trim();
            config.systemPrompt = systemPrompt.value.trim();
            localStorage.setItem('ai_config', JSON.stringify(config));
            alert('Đã lưu cấu hình thành công!');
            configPanel.classList.add('translate-x-full');
        };

        function renderKnowledgeList() {
            knowledgeCountBadge.textContent = knowledgeBase.length;
            knowledgeCountBadge.classList.toggle('hidden', knowledgeBase.length === 0);

            if (knowledgeBase.length === 0) {
                knowledgeList.innerHTML = `<p class="text-slate-400 italic text-center py-4">Chưa có dữ liệu nào.</p>`;
                return;
            }
            knowledgeList.innerHTML = knowledgeBase.map((item, idx) => `
                <div class="p-2 rounded bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex justify-between items-start gap-2">
                    <p class="truncate flex-1">${item}</p>
                    <button onclick="removeKnowledge(${idx})" class="text-red-500 hover:text-red-700"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        }

        window.removeKnowledge = (idx) => {
            knowledgeBase.splice(idx, 1);
            localStorage.setItem('ai_knowledge', JSON.stringify(knowledgeBase));
            renderKnowledgeList();
        };

        addKnowledgeBtn.onclick = () => {
            const val = knowledgeText.value.trim();
            if (val) {
                knowledgeBase.push(val);
                localStorage.setItem('ai_knowledge', JSON.stringify(knowledgeBase));
                knowledgeText.value = '';
                renderKnowledgeList();
            }
        };

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const text = ev.target.result;
                const chunks = text.split(/\n\s*\n/).map(c => c.trim()).filter(c => c.length > 20);
                knowledgeBase.push(...chunks);
                localStorage.setItem('ai_knowledge', JSON.stringify(knowledgeBase));
                renderKnowledgeList();
                fileInput.value = '';
            };
            reader.readAsText(file);
        };

        function findRelevantContext(query) {
            if (knowledgeBase.length === 0) return "";
            const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 2);
            const scored = knowledgeBase.map(doc => {
                let score = 0;
                words.forEach(w => {
                    if (doc.toLowerCase().includes(w)) score++;
                });
                return { doc, score };
            });
            const best = scored.filter(s => s.score > 0).sort((a,b) => b.score - a.score).slice(0, 3);
            return best.map(b => b.doc).join('\n---\n');
        }

        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = userInput.scrollHeight + 'px';
        });
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';
            userInput.style.height = 'auto';

            const context = findRelevantContext(message);
            const assistantMsgDiv = appendMessage('assistant', '<span class="animate-pulse">Đang suy nghĩ...</span>');

            try {
                let responseText = "";

                if (config.engine === 'gemini') {
                    if (!config.apiKey) throw new Error("Chưa điền Gemini API Key trong phần Cấu hình.");
                    
                    const promptText = `${config.systemPrompt}\n\n${context ? 'Ngữ cảnh tài liệu:\n' + context + '\n\n' : ''}Câu hỏi: ${message}`;
                    
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${config.apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptText }] }]
                        })
                    });
                    
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    if (!data.candidates || data.candidates.length === 0) throw new Error("Không nhận được phản hồi từ AI.");
                    
                    responseText = data.candidates[0].content.parts[0].text;

                } else if (config.engine === 'ollama') {
                    const res = await fetch('http://localhost:11434/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: config.ollamaModel || 'llama3',
                            prompt: message,
                            system: config.systemPrompt + (context ? '\nNgữ cảnh:\n' + context : ''),
                            stream: false
                        })
                    });
                    const data = await res.json();
                    responseText = data.response;

                } else {
                    await new Promise(r => setTimeout(r, 600));
                    if (context) {
                        responseText = `[Tra cứu từ tài liệu RAG]:\n\nTôi tìm thấy thông tin liên quan sau đây:\n"${context}"\n\nBạn có muốn biết thêm chi tiết nào khác không?`;
                    } else {
                        responseText = `Tôi là AI Tùng Lâm, đã nhận câu hỏi: "${message}". Hiện tại trang đang chạy ở chế độ Động cơ Nội trang. Để trò chuyện thông minh như ChatGPT, bạn hãy mở mục Cấu hình và điền Gemini API Key nhé!`;
                    }
                }

                assistantMsgDiv.querySelector('.msg-content').innerText = responseText;

            } catch (err) {
                assistantMsgDiv.querySelector('.msg-content').innerHTML = `<span class="text-red-500">⚠️ Lỗi: ${err.message}</span>`;
            }
        };

        function appendMessage(role, content) {
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start gap-3 ${isUser ? 'flex-row-reverse' : ''}`;
            
            const iconHtml = isUser 
                ? `<div class="w-8 h-8 rounded-lg bg-slate-700 text-white flex items-center justify-center shrink-0"><i data-lucide="user" class="w-4 h-4"></i></div>`
                : `<div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center shrink-0"><i data-lucide="bot" class="w-4 h-4"></i></div>`;

            const bubbleHtml
