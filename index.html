<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tùng Lâm</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md text-lg">
                🤖
            </div>
            <div>
                <h1 class="font-bold text-base md:text-lg leading-none">AI Tùng Lâm</h1>
                <span class="text-xs text-slate-500 dark:text-slate-400">3 Cấp Độ: Prompt • RAG • Đa Động Cơ</span>
            </div>
        </div>
        
        <div class="flex items-center space-x-2">
            <button id="toggleKnowledgeBtn" type="button" class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-1.5 transition">
                <span>📚</span>
                <span class="hidden sm:inline">Tri thức (RAG)</span>
                <span id="knowledgeCountBadge" class="bg-blue-600 text-white rounded-full px-1.5 py-0.2 text-[10px] hidden">0</span>
            </button>
            <button id="toggleConfigBtn" type="button" class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-1.5 transition">
                <span>⚙️</span>
                <span class="hidden sm:inline">Cấu hình</span>
            </button>
            <button id="themeToggleBtn" type="button" class="p-2 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm">
                🌓
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Panel Cấu hình -->
        <aside id="configPanel" class="absolute inset-y-0 right-0 w-80 max-w-full bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 shadow-xl p-4 flex flex-col space-y-4 transform translate-x-full transition-transform duration-300 z-20 overflow-y-auto">
            <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-800">
                <h2 class="font-semibold text-sm flex items-center gap-1">
                    ⚙️ Cấu hình Mô hình
                </h2>
                <button id="closeConfigBtn" type="button" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded text-slate-500 font-bold">
                    ✕
                </button>
            </div>

            <div>
                <label class="block text-xs font-medium mb-1">Động cơ xử lý (Engine):</label>
                <select id="engineSelect" class="w-full text-xs p-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none">
                    <option value="gemini">Google Gemini API (Khuyên dùng)</option>
                    <option value="builtin">Động cơ Nội trang</option>
                    <option value="ollama">Ollama Local (http://localhost:11434)</option>
                </select>
            </div>

            <div id="apiKeyContainer">
                <label class="block text-xs font-medium mb-1">Gemini API Key:</label>
                <input type="password" id="geminiApiKey" placeholder="AIzaSy..." class="w-full text-xs p-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-8
